<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kyocera Parts">
<title>Kyocera Parts Dashboard — Fuser / Drum / Developer / Transfer Belt</title>
<style>
  :root{
    --red:#C8102E; --red-lt:#E4002B;
    --ink:#1D1D1B; --ink-2:#4A4A48; --ink-3:#8A8A87;
    --line:#DCDCD8; --panel:#F4F4F2; --white:#FFFFFF;
    --k:#1D1D1B; --c:#00A0DF; --m:#D6006E; --y:#FFC400;
    --ok:#1E7A3C;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;padding:0}
  body{height:100dvh}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    color:var(--ink); background:var(--white); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- header ---------- */
  header{border-bottom:1px solid var(--line);background:var(--white);flex:0 0 auto;z-index:20}
  .bar{display:flex;align-items:baseline;gap:18px;padding:16px 24px 14px}
  .mark{font-size:22px;font-weight:700;letter-spacing:.24em;color:var(--red);line-height:1}
  .mark span{color:var(--ink);font-weight:400;letter-spacing:.08em;font-size:13px;margin-left:14px}
  .saved{margin-left:auto;font-size:12px;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
  .saved.on{color:var(--ok);font-weight:600}
  .rule{height:3px;background:var(--red)}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:290px minmax(0,1fr);flex:1 1 auto;min-height:0;overflow:hidden}

  /* ---------- sidebar ---------- */
  aside{background:var(--panel);border-right:1px solid var(--line);padding:0 0 28px;
        overflow-y:auto;overscroll-behavior:contain;min-height:0}
  .stick{padding:14px 18px 12px;position:sticky;top:0;background:var(--panel);z-index:10;border-bottom:1px solid var(--line)}
  .stick input[type=search]{width:100%;padding:9px 11px;font-size:14px;font-family:inherit;
        border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:0}
  .stick input[type=search]:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
  .grp{padding:18px 18px 4px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .mdl{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;
       border-left:3px solid transparent;padding:8px 18px;font-family:inherit;font-size:14px;
       color:var(--ink-2);cursor:pointer;line-height:1.3}
  .mdl:hover{background:#EAEAE7;color:var(--ink)}
  .mdl:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
  .mdl.on{background:var(--white);border-left-color:var(--red);color:var(--ink);font-weight:700}
  .tag{width:6px;height:6px;border-radius:50%;background:var(--red);flex:0 0 auto}
  .none{padding:16px 18px;font-size:13px;color:var(--ink-3);line-height:1.5}
  .sidefoot{display:flex;flex-direction:column;gap:8px;margin:26px 18px 0;padding-top:18px;border-top:1px solid var(--line)}

  /* ---------- buttons ---------- */
  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer;
       border:1px solid var(--red);background:var(--red);color:#fff;border-radius:0;letter-spacing:.02em}
  .btn:hover{background:var(--red-lt);border-color:var(--red-lt)}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
  .btn.ghost:hover{background:var(--panel);color:var(--ink);border-color:var(--ink-3)}
  .btn.danger{background:transparent;color:var(--red);border-color:var(--line)}
  .btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.wide{width:100%;margin-top:10px}

  /* ---------- main ---------- */
  main{padding:30px 34px 60px;overflow-y:auto;overscroll-behavior:contain;min-height:0}
  main>*{max-width:1100px}
  .head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .title{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
  .sub{font-size:13px;color:var(--ink-3);margin:0 0 26px}
  .sub b{color:var(--ink-2);font-weight:600}
  .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .card{border:1px solid var(--line);background:var(--white);padding:20px 22px 22px;position:relative}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
  .card.na::before{background:var(--line)}
  .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:12px}
  .item{font-size:38px;font-weight:700;letter-spacing:.01em;line-height:1.1;word-break:break-word}
  .card.na .item{font-size:20px;color:var(--ink-3);font-weight:400;letter-spacing:0}
  .note{font-size:12px;color:var(--ink-2);margin-top:10px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:5px 10px 5px 7px;font-size:14px;font-weight:600}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .dot.k{background:var(--k)} .dot.c{background:var(--c)} .dot.m{background:var(--m)} .dot.y{background:var(--y)}

  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.6}
  .empty{padding:60px 0;color:var(--ink-3);font-size:15px;line-height:1.7}

  /* ---------- editor ---------- */
  .form{border:1px solid var(--line);border-top:3px solid var(--red);padding:22px 24px 24px;margin-top:4px}
  .frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
  .f{display:flex;flex-direction:column;gap:6px}
  .f.full{grid-column:1 / -1}
  .f label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .f input[type=text], .f select{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);
       background:var(--white);color:var(--ink);border-radius:0;width:100%}
  .f input[type=text]:focus,.f select:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
  .hint{font-size:12px;color:var(--ink-3);line-height:1.5}
  .cbx{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink-2);padding-top:6px}
  .cbx input{width:16px;height:16px;accent-color:var(--red)}
  .fbtns{display:flex;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
  .fbtns .right{margin-left:auto;display:flex;gap:10px}

  /* back button — phone only */
  .back{display:none}

  /* ---------- tablet ---------- */
  @media (max-width:960px){
    .shell{grid-template-columns:240px minmax(0,1fr)}
    .grid,.frow{grid-template-columns:1fr}
    main{padding:24px 22px 48px}
    .item{font-size:34px}
  }

  /* ---------- phone: one pane at a time ---------- */
  @media (max-width:720px){
    .bar{padding:11px 16px 10px;gap:10px}
    .mark{font-size:17px;letter-spacing:.18em}
    .mark span{display:none}
    .saved{font-size:11px}

    .shell{display:block;position:relative}
    aside,main{position:absolute;inset:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
    aside{border-right:0;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
    body[data-view="list"] main{display:none}
    body[data-view="detail"] aside{display:none}

    .stick{padding:12px 14px}
    .stick input[type=search]{font-size:16px;padding:12px 12px}
    .btn{font-size:15px;padding:13px 16px}
    .btn.wide{margin-top:10px}
    .grp{padding:20px 16px 4px}
    .mdl{padding:14px 16px;font-size:16px}

    main{padding:16px 16px calc(56px + env(safe-area-inset-bottom))}
    .back{display:inline-flex;align-items:center;margin-bottom:14px}
    .head{gap:12px}
    .title{font-size:24px}
    .sub{margin-bottom:18px;font-size:12px}
    .acts{margin-left:0;width:100%;gap:8px}
    .acts .btn{flex:1 1 140px}

    .grid{gap:12px}
    .card{padding:16px 18px 18px}
    .item{font-size:30px}
    .chip{font-size:15px;padding:8px 12px 8px 9px}

    .form{padding:18px 16px 20px}
    .frow{gap:14px}
    .f input[type=text],.f select{font-size:16px;padding:12px}
    .fbtns{gap:8px}
    .fbtns .btn{flex:1 1 140px}
    .fbtns .right{margin-left:0;width:100%;gap:8px}
    .empty{padding:32px 0;font-size:15px}
  }
  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .18s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body data-view="list">

<header>
  <div class="bar">
    <div class="mark">KYOCERA<span>Parts Dashboard</span></div>
    <div class="saved" id="status">Loading…</div>
  </div>
  <div class="rule"></div>
</header>

<div class="shell">
  <aside>
    <div class="stick">
      <input id="q" type="search" placeholder="Filter models — try 6053" aria-label="Filter models">
      <button class="btn wide" id="addBtn">+ Add machine</button>
    </div>
    <nav id="list" aria-label="Machine models"></nav>
    <div class="sidefoot">
      <button class="btn ghost" id="expBtn">Export backup</button>
      <button class="btn ghost" id="impBtn">Import backup</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

/* ============================================================
   Storage — window.storage if the host provides it, otherwise
   localStorage, otherwise memory only.
   ============================================================ */
const KEY='kyocera-parts-dash-v1';
let backend='memory', mem=null;

async function load(){
  if(window.storage){
    try{ const r=await window.storage.get(KEY,false); backend='synced';
         if(r && r.value) return JSON.parse(r.value); return {overrides:{},custom:[]}; }
    catch(e){ backend='synced'; /* key not set yet */ }
  }
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); backend='local';
       const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }
  catch(e){ backend='memory'; }
  return {overrides:{},custom:[]};
}
async function persist(obj){
  const s=JSON.stringify(obj);
  if(window.storage){ try{ await window.storage.set(KEY,s,false); return true; }catch(e){} }
  try{ localStorage.setItem(KEY,s); return true; }catch(e){}
  mem=s; return false;
}

/* ============================================================
   State
   ============================================================ */
let saveData={overrides:{},custom:[]};
let models=[], current=null, editing=null, saveTimer=null;

function rebuild(){
  const b=BUILTIN.map(m=>{
    const o=saveData.overrides[m.id];
    return o ? Object.assign({},m,o,{id:m.id,builtin:true,edited:true}) : m;
  });
  models=b.concat(saveData.custom.map(m=>Object.assign({},m,{builtin:false})));
}

const statusEl=document.getElementById('status');
function setStatus(t,ok){ statusEl.textContent=t; statusEl.classList.toggle('on',!!ok); }

function scheduleSave(){
  setStatus('Saving…',false);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const ok=await persist(saveData);
    if(!ok) setStatus('Not saved — storage blocked. Use Export.',false);
    else setStatus(backend==='synced'?'All changes saved':'Saved on this device',true);
  },450);
}

/* ============================================================
   Sidebar
   ============================================================ */
const listEl=document.getElementById('list'), mainEl=document.getElementById('main'), qEl=document.getElementById('q');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderList(){
  const t=(qEl.value||'').trim().toLowerCase();
  listEl.innerHTML=''; let shown=0;
  GROUPS.forEach(g=>{
    const hits=models.filter(m=>m.g===g).filter(m=>!t||m.n.toLowerCase().includes(t)
      ||[m.f,m.d,m.v,m.b].some(x=>x&&String(x).toLowerCase().includes(t)));
    if(!hits.length)return;
    shown+=hits.length;
    const h=document.createElement('div'); h.className='grp'; h.textContent=g; listEl.appendChild(h);
    hits.forEach(m=>{
      const b=document.createElement('button');
      b.className='mdl'+(current&&current.id===m.id?' on':'');
      b.innerHTML=(!m.builtin||m.edited?'<span class="tag" title="custom or edited"></span>':'')+esc(m.n);
      b.onclick=()=>{ current=m; editing=null; renderList(); showModel(m); };
      listEl.appendChild(b);
    });
  });
  if(!shown){ const d=document.createElement('div'); d.className='none';
    d.textContent='No machine matches that. Try a model number like 4054, or add it with the button above.';
    listEl.appendChild(d); }
}

/* ============================================================
   Read-only view
   ============================================================ */
function card(label,value,note){
  if(!value) return `<div class="card na"><div class="lbl">${label}</div>
    <div class="item">Not used on this machine</div>${note?`<div class="note">${esc(note)}</div>`:''}</div>`;
  return `<div class="card"><div class="lbl">${label}</div>
    <div class="item">${esc(value)}</div>${note?`<div class="note">${esc(note)}</div>`:''}</div>`;
}
function devCard(m){
  if(!m.v) return card('Developer','');
  const c=(m.vc||[]);
  if(c.length>1){
    const chips='<div class="chips">'+c.map(k=>
      `<span class="chip"><span class="dot ${k.toLowerCase()}"></span>${esc(m.v+k)}</span>`).join('')+'</div>';
    return `<div class="card"><div class="lbl">Developer — ${c.length} items</div>
      <div class="item">${esc(m.v)}</div>${chips}</div>`;
  }
  return card('Developer', m.v+(c[0]||''));
}

function showModel(m){
  mainEl.innerHTML=`
    <button class="btn ghost back" id="backBtn">&#8592;&nbsp; Machines</button>
    <div class="head">
      <div>
        <h1 class="title">${esc(m.n)}</h1>
        <p class="sub">Consumable unit items · <b>120 V (US / Canada)</b>${
          m.builtin?(m.edited?' · edited':' · from parts manual'):' · added by you'}</p>
      </div>
      <div class="acts">
        <button class="btn ghost" id="editBtn">Edit parts</button>
        ${m.builtin&&m.edited?'<button class="btn ghost" id="resetBtn">Reset to manual</button>':''}
        ${!m.builtin?'<button class="btn danger" id="delBtn">Delete</button>':''}
      </div>
    </div>
    <div class="grid">
      ${card('Fuser',m.f)}
      ${card('Drum',m.d,m.dn)}
      ${devCard(m)}
      ${card('Transfer Belt',m.b, m.b?null:'No belt unit recorded for this machine.')}
    </div>
    <p class="foot">Items only, not full 10-digit part numbers. Verify the voltage variant before ordering —
    100 V, 230 V and 240 V machines use different fuser items.</p>`;
  document.getElementById('backBtn').onclick=goList;
  document.getElementById('editBtn').onclick=()=>openEditor(m,false);
  const rb=document.getElementById('resetBtn');
  if(rb) rb.onclick=()=>{ delete saveData.overrides[m.id]; scheduleSave(); rebuild();
    current=models.find(x=>x.id===m.id); renderList(); showModel(current); };
  const db=document.getElementById('delBtn');
  if(db) db.onclick=()=>{ if(!confirm('Delete '+m.n+'?'))return;
    saveData.custom=saveData.custom.filter(x=>x.id!==m.id); scheduleSave(); rebuild();
    current=null; renderList(); showEmpty(); goList(); };
  goDetail();
}

function showEmpty(){
  mainEl.innerHTML=`<div class="empty">Pick a machine to see its fuser, drum, developer
    and transfer belt.<br>Use <b>+ Add machine</b> for anything not in the list, or <b>Edit parts</b> to
    correct an item. Changes save automatically.</div>`;
}

/* ============================================================
   Editor — autosaves on every keystroke
   ============================================================ */
function openEditor(m,isNew){
  editing={ id:m.id, isNew:!!isNew,
    n:m.n||'', g:m.g||GROUPS[4], f:m.f||'', d:m.d||'', dn:m.dn||'', v:m.v||'', vc:(m.vc||[]).slice(), b:m.b||'' };
  drawEditor();
}

function drawEditor(){
  const e=editing, colour=e.vc.length>1;
  mainEl.innerHTML=`
    <button class="btn ghost back" id="backBtn">&#8592;&nbsp; Machines</button>
    <div class="head"><div>
      <h1 class="title">${e.isNew?'Add machine':'Edit '+esc(e.n||'machine')}</h1>
      <p class="sub">Enter items only — for example <b>DK-8550</b>. Leave a field blank if the machine doesn't use it. Saves as you type.</p>
    </div></div>
    <div class="form">
      <div class="frow">
        <div class="f full"><label for="e_n">Model name</label>
          <input type="text" id="e_n" value="${esc(e.n)}" placeholder="TASKalfa 4054ci"></div>
        <div class="f full"><label for="e_g">Group</label>
          <select id="e_g">${GROUPS.map(g=>`<option value="${esc(g)}"${g===e.g?' selected':''}>${esc(g)}</option>`).join('')}</select></div>
        <div class="f"><label for="e_f">Fuser</label>
          <input type="text" id="e_f" value="${esc(e.f)}" placeholder="FK-8570"></div>
        <div class="f"><label for="e_b">Transfer belt</label>
          <input type="text" id="e_b" value="${esc(e.b)}" placeholder="TR-8560">
          <span class="hint">Blank = machine has no belt unit.</span></div>
        <div class="f"><label for="e_d">Drum</label>
          <input type="text" id="e_d" value="${esc(e.d)}" placeholder="DK-8560"></div>
        <div class="f"><label for="e_dn">Drum note (optional)</label>
          <input type="text" id="e_dn" value="${esc(e.dn)}" placeholder="e.g. black and colour drums differ"></div>
        <div class="f"><label for="e_v">Developer</label>
          <input type="text" id="e_v" value="${esc(e.v)}" placeholder="DV-8570">
          <span class="hint">${colour?'Base item — K, C, M and Y are added automatically.':'Enter the item exactly as it should read.'}</span></div>
        <div class="f"><label>Colour set</label>
          <label class="cbx"><input type="checkbox" id="e_col"${colour?' checked':''}> Four developers (K / C / M / Y)</label></div>
      </div>
      <div class="fbtns">
        ${e.isNew?'<button class="btn ghost" id="cancelBtn">Discard</button>':''}
        <div class="right">
          <button class="btn" id="doneBtn">Done editing</button>
        </div>
      </div>
    </div>`;

  const bind=(id,key)=>{ const el=document.getElementById(id);
    el.addEventListener('input',()=>{ editing[key]=el.value; commitEdit(); }); };
  ['n','g','f','d','dn','v','b'].forEach(k=>bind('e_'+k,k));
  document.getElementById('e_col').addEventListener('change',ev=>{
    editing.vc = ev.target.checked ? ["K","C","M","Y"] : [];
    commitEdit(); drawEditor(); document.getElementById('e_col').focus();
  });
  document.getElementById('doneBtn').onclick=finishEdit;
  document.getElementById('backBtn').onclick=()=>{ finishEdit(); goList(); };
  const cb=document.getElementById('cancelBtn');
  if(cb) cb.onclick=()=>{
    if(!editing.n.trim()){
      saveData.custom=saveData.custom.filter(x=>x.id!==editing.id); scheduleSave(); rebuild();
      current=null; editing=null; renderList(); showEmpty(); goList(); return;
    }
    finishEdit();
  };
  if(e.isNew) document.getElementById('e_n').focus();
  goDetail();
}

function commitEdit(){
  const e=editing;
  const rec={ n:e.n.trim()||'Untitled machine', g:e.g, f:e.f.trim(), d:e.d.trim(),
              dn:e.dn.trim(), v:e.v.trim(), vc:e.vc.slice(), b:e.b.trim() };
  const bi=BUILTIN.find(x=>x.id===e.id);
  if(bi) saveData.overrides[e.id]=rec;
  else{
    const i=saveData.custom.findIndex(x=>x.id===e.id);
    const full=Object.assign({id:e.id},rec);
    if(i>=0) saveData.custom[i]=full; else saveData.custom.push(full);
  }
  scheduleSave(); rebuild();
  current=models.find(x=>x.id===e.id)||current;
  renderList();
}

function finishEdit(){
  const id=editing.id; editing=null; rebuild();
  current=models.find(x=>x.id===id);
  renderList(); if(current) showModel(current); else showEmpty();
}

/* ============================================================
   Add / backup
   ============================================================ */
document.getElementById('addBtn').onclick=()=>{
  const id='c'+Date.now().toString(36);
  const rec={id,n:'',g:GROUPS[4],f:'',d:'',dn:'',v:'',vc:[],b:''};
  saveData.custom.push(rec); scheduleSave(); rebuild();
  current=models.find(x=>x.id===id); renderList(); openEditor(current,true);
};

function exportJSON(){
  const blob=new Blob([JSON.stringify(saveData,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='kyocera-parts-dashboard-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importJSON(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result);
        saveData={overrides:o.overrides||{},custom:o.custom||[]};
        scheduleSave(); rebuild(); current=null; renderList(); showEmpty();
      }catch(err){ alert('That file could not be read as a dashboard backup.'); } };
    r.readAsText(f); };
  inp.click();
}

function goDetail(){ document.body.dataset.view='detail'; mainEl.scrollTop=0; }
function goList(){ document.body.dataset.view='list'; }

document.getElementById('expBtn').onclick=exportJSON;
document.getElementById('impBtn').onclick=importJSON;
qEl.addEventListener('input',renderList);

(async function init(){
  saveData=await load(); rebuild(); renderList(); showEmpty();
  setStatus(backend==='synced'?'All changes saved automatically'
          : backend==='local'?'Saves automatically on this device'
          : 'Storage unavailable — use Export to keep changes', backend!=='memory');
})();
</script>
</body>
</html>
