<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Matchups</title>
<style>
  :root{
    --bg:#12141f;
    --surface:#1b1e2d;
    --surface-2:#242840;
    --line:#333a56;
    --text:#eef0f8;
    --text-dim:#9198b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    padding:24px 14px 40px;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 6px;
  }
  h1{
    font-size:28px;
    font-weight:800;
    letter-spacing:-.01em;
    margin:0;
  }
  .sub{color:var(--text-dim);font-size:14px;margin:0;max-width:560px;line-height:1.5;}

  .panel{
    background:linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 60%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:16px 16px 18px;
    margin-bottom:16px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
  }
  @media (min-width:600px){
    .panel{border-radius:24px;padding:22px 24px 26px;margin-bottom:20px;}
  }
  .panel-title{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 14px;
  }

  .hex-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .hex-btn{
    position:relative;
    border:none;
    border-radius:14px;
    cursor:pointer;
    flex:1 1 calc(33.333% - 6px);
    min-width:88px;
    height:42px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    letter-spacing:.02em;
    color:#12141f;
    opacity:.5;
    box-shadow:0 2px 8px -2px rgba(0,0,0,.35);
    transition:opacity .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  @media (min-width:600px){
    .hex-btn{flex:0 1 auto;min-width:96px;padding:0 18px;}
  }
  .hex-btn:hover{opacity:.78;transform:translateY(-2px);box-shadow:0 6px 16px -4px rgba(0,0,0,.45);}
  .hex-btn.active{opacity:1;transform:translateY(-1px);}
  .hex-btn:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  .clear-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px;}
  .hint{font-size:12px;color:var(--text-dim);}
  .clear-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    padding:7px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .clear-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (min-width:600px){.results{grid-template-columns:repeat(4,1fr);gap:12px;}}
  .result-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 12px;
    min-height:88px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .result-card .rc-title{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    margin:0 0 8px;
  }
  .rc-mult{font-size:10px;font-weight:600;opacity:.8;}
  .chip-row{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    color:#12141f;
    box-shadow:0 1px 4px -1px rgba(0,0,0,.3);
  }
  .empty-note{color:var(--text-dim);font-size:13px;padding:8px 2px;}

  footer{margin-top:24px;text-align:center;color:var(--text-dim);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">Reference tool</p>
  <h1>Type Matchup</h1>
</header>

<div class="panel">
  <p class="panel-title">Type</p>
  <div class="hex-grid" id="hexGrid"></div>
  <div class="clear-row">
    <span class="hint" id="selHint">Select a type</span>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Attacking</p>
  <div class="results" id="atkResults"></div>
</div>

<div class="panel">
  <p class="panel-title">Defending</p>
  <div class="results" id="defResults"></div>
</div>

<footer>Multipliers reflect the standard modern type chart.</footer>

</div>

<script>
const TYPES = ["Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"];

const COLORS = {
  Normal:"#A8A878", Fire:"#F08030", Water:"#6890F0", Electric:"#F8D030",
  Grass:"#78C850", Ice:"#98D8D8", Fighting:"#C03028", Poison:"#A040A0",
  Ground:"#E0C068", Flying:"#A890F0", Psychic:"#F85888", Bug:"#A8B820",
  Rock:"#B8A038", Ghost:"#705898", Dragon:"#7038F8", Dark:"#705848",
  Steel:"#B8B8D0", Fairy:"#EE99AC"
};

const CHART = {
  Normal:{Rock:0.5, Ghost:0, Steel:0.5},
  Fire:{Fire:0.5, Water:0.5, Grass:2, Ice:2, Bug:2, Rock:0.5, Dragon:0.5, Steel:2},
  Water:{Fire:2, Water:0.5, Grass:0.5, Ground:2, Rock:2, Dragon:0.5},
  Electric:{Water:2, Electric:0.5, Grass:0.5, Ground:0, Flying:2, Dragon:0.5},
  Grass:{Fire:0.5, Water:2, Grass:0.5, Poison:0.5, Ground:2, Flying:0.5, Bug:0.5, Rock:2, Dragon:0.5, Steel:0.5},
  Ice:{Fire:0.5, Water:0.5, Grass:2, Ice:0.5, Ground:2, Flying:2, Dragon:2, Steel:0.5},
  Fighting:{Normal:2, Ice:2, Poison:0.5, Flying:0.5, Psychic:0.5, Bug:0.5, Rock:2, Ghost:0, Dark:2, Steel:2, Fairy:0.5},
  Poison:{Grass:2, Poison:0.5, Ground:0.5, Rock:0.5, Ghost:0.5, Steel:0, Fairy:2},
  Ground:{Fire:2, Electric:2, Grass:0.5, Poison:2, Flying:0, Bug:0.5, Rock:2, Steel:2},
  Flying:{Electric:0.5, Grass:2, Fighting:2, Bug:2, Rock:0.5, Steel:0.5},
  Psychic:{Fighting:2, Poison:2, Psychic:0.5, Dark:0, Steel:0.5},
  Bug:{Fire:0.5, Grass:2, Fighting:0.5, Poison:0.5, Flying:0.5, Psychic:2, Ghost:0.5, Dark:2, Steel:0.5, Fairy:0.5},
  Rock:{Fire:2, Ice:2, Fighting:0.5, Ground:0.5, Flying:2, Bug:2, Steel:0.5},
  Ghost:{Normal:0, Psychic:2, Ghost:2, Dark:0.5},
  Dragon:{Dragon:2, Steel:0.5, Fairy:0},
  Dark:{Fighting:0.5, Psychic:2, Ghost:2, Dark:0.5, Fairy:0.5},
  Steel:{Fire:0.5, Water:0.5, Electric:0.5, Ice:2, Rock:2, Steel:0.5, Fairy:2},
  Fairy:{Fire:0.5, Fighting:2, Poison:0.5, Dragon:2, Dark:2, Steel:0.5}
};

function getMult(atk, def){
  const row = CHART[atk];
  if(row && Object.prototype.hasOwnProperty.call(row, def)) return row[def];
  return 1;
}

let selected = [];

function renderHexGrid(){
  const grid = document.getElementById('hexGrid');
  grid.innerHTML = '';
  TYPES.forEach(t => {
    const btn = document.createElement('button');
    const isActive = selected.includes(t);
    btn.className = 'hex-btn' + (isActive ? ' active' : '');
    btn.style.background = COLORS[t];
    btn.style.color = '#12141f';
    if(isActive){
      btn.style.boxShadow = `0 0 0 3px var(--bg), 0 0 0 5px ${COLORS[t]}, 0 6px 18px -4px rgba(0,0,0,.5)`;
    }
    btn.textContent = t;
    btn.setAttribute('aria-pressed', isActive);
    btn.onclick = () => toggleType(t);
    grid.appendChild(btn);
  });
}

function toggleType(t){
  if(selected.includes(t)){
    selected = selected.filter(x => x !== t);
  } else {
    if(selected.length >= 2) selected.shift();
    selected.push(t);
  }
  renderAll();
}

function renderHint(){
  const hint = document.getElementById('selHint');
  hint.textContent = selected.length ? selected.join(' / ') : 'Select 1 or 2 types';
}

function bucketColor(label){
  if(label.includes('4x') || label.includes('2x')) return '#f0997b';
  if(label.includes('No effect')) return '#9198b8';
  if(label.includes('0.25') || label.includes('0.5')) return '#9fe1cb';
  return 'var(--text-dim)';
}

function buildBuckets(mults){
  const buckets = {
    '4x': [], '2x': [], '1x': [],
    '0.5x': [], '0.25x': [], 'No effect': []
  };
  Object.entries(mults).forEach(([t, mult]) => {
    mult = Math.round(mult * 100) / 100;
    if(mult === 4) buckets['4x'].push(t);
    else if(mult === 2) buckets['2x'].push(t);
    else if(mult === 1) buckets['1x'].push(t);
    else if(mult === 0.5) buckets['0.5x'].push(t);
    else if(mult === 0.25) buckets['0.25x'].push(t);
    else if(mult === 0) buckets['No effect'].push(t);
  });
  return buckets;
}

function renderBucketCards(container, buckets, suffix){
  container.innerHTML = '';
  Object.entries(buckets).forEach(([label, list]) => {
    if(list.length === 0) return;
    const fullLabel = label + ' ' + suffix;
    const card = document.createElement('div');
    card.className = 'result-card';
    const title = document.createElement('p');
    title.className = 'rc-title';
    title.style.color = bucketColor(label);
    title.textContent = fullLabel;
    const chips = document.createElement('div');
    chips.className = 'chip-row';
    list.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.background = COLORS[t];
      chip.textContent = t;
      chips.appendChild(chip);
    });
    card.appendChild(title);
    card.appendChild(chips);
    container.appendChild(card);
  });
}

function renderResults(){
  const atkContainer = document.getElementById('atkResults');
  const defContainer = document.getElementById('defResults');
  if(selected.length === 0){
    atkContainer.innerHTML = '<div class="empty-note">Pick a type above to see its offensive matchups.</div>';
    defContainer.innerHTML = '<div class="empty-note">Pick a type above to see its defensive matchups.</div>';
    return;
  }

  // Offense: a dual-type Pokemon attacks with one move type at a time, so show each
  // selected type's offensive chart separately rather than combining them.
  atkContainer.innerHTML = '';
  selected.forEach(moveType => {
    if(selected.length > 1){
      const label = document.createElement('p');
      label.className = 'panel-title';
      label.style.margin = '4px 0 8px';
      label.style.color = COLORS[moveType];
      label.textContent = moveType + ' moves';
      atkContainer.appendChild(label);
    }
    const group = document.createElement('div');
    group.className = 'results';
    const atkMults = {};
    TYPES.forEach(def => { atkMults[def] = getMult(moveType, def); });
    renderBucketCards(group, buildBuckets(atkMults), 'dealt');
    atkContainer.appendChild(group);
  });

  // Defense: incoming damage hits both types at once, so multipliers combine.
  const defMults = {};
  TYPES.forEach(atk => {
    let mult = 1;
    selected.forEach(def => { mult *= getMult(atk, def); });
    defMults[atk] = mult;
  });
  renderBucketCards(defContainer, buildBuckets(defMults), 'taken');
}

document.getElementById('clearBtn').onclick = () => { selected = []; renderAll(); };

function renderAll(){
  renderHexGrid();
  renderHint();
  renderResults();
}

renderAll();
</script>
</body>
</html>
