<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Matchups</title>
<style>
  :root{
    --bg:#12141f;
    --surface:#1b1e2d;
    --surface-2:#242840;
    --line:#333a56;
    --text:#eef0f8;
    --text-dim:#9198b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 6px;
  }
  h1{
    font-size:32px;
    font-weight:800;
    letter-spacing:-.01em;
    margin:0 0 8px;
  }
  .sub{color:var(--text-dim);font-size:14px;margin:0;max-width:560px;line-height:1.5;}

  .panel{
    background:linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 60%);
    border:1px solid var(--line);
    border-radius:24px;
    padding:22px 24px 26px;
    margin-bottom:20px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .panel-title{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:700;
    margin:0 0 14px;
  }

  .hex-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .hex-btn{
    position:relative;
    border:none;
    border-radius:14px;
    cursor:pointer;
    min-width:96px;
    height:42px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:13px;
    letter-spacing:.02em;
    color:#12141f;
    opacity:.5;
    box-shadow:0 2px 8px -2px rgba(0,0,0,.35);
    transition:opacity .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .hex-btn:hover{opacity:.78;transform:translateY(-2px);box-shadow:0 6px 16px -4px rgba(0,0,0,.45);}
  .hex-btn.active{opacity:1;transform:translateY(-1px);}
  .hex-btn:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  .clear-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .hint{font-size:12px;color:var(--text-dim);}
  .clear-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    padding:7px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .clear-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:720px){.results{grid-template-columns:repeat(2,1fr);}}
  .result-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 16px 14px;
    min-height:96px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .result-card .rc-title{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    margin:0 0 8px;
  }
  .rc-mult{font-size:10px;font-weight:600;opacity:.8;}
  .chip-row{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    color:#12141f;
    box-shadow:0 1px 4px -1px rgba(0,0,0,.3);
  }
  .empty-note{color:var(--text-dim);font-size:13px;padding:8px 2px;}

  .matrix-toggle{
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text-dim);cursor:pointer;
    user-select:none;
  }
  .matrix-toggle input{accent-color:#7f77dd;}

  .matrix-wrap{overflow-x:auto;margin-top:16px;border-radius:16px;}
  table.matrix{border-collapse:separate;border-spacing:2px;font-size:10px;min-width:760px;}
  table.matrix th, table.matrix td{
    width:34px;height:34px;text-align:center;padding:0;
    border-radius:6px;
  }
  table.matrix th{
    font-size:9px;font-weight:700;color:#12141f;
    writing-mode:vertical-rl;transform:rotate(180deg);
    background:var(--surface-2);
  }
  table.matrix th.row-head{
    writing-mode:horizontal-tb;transform:none;
    text-align:right;padding-right:10px;
    width:78px;
    background:transparent;
  }
  table.matrix td{font-weight:700;color:var(--text);}
  .m0{background:#20222f;color:#565c7a;}
  .mhalf{background:#213347;}
  .mquarter{background:#1a2a3a;}
  .m1{background:transparent;color:var(--text-dim);}
  .m2{background:#4a2338;}
  .m4{background:#6e1f34;}

  footer{margin-top:24px;text-align:center;color:var(--text-dim);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">Reference tool</p>
  <h1>Type Matchup</h1>
</header>

<div class="panel">
  <p class="panel-title">Type</p>
  <div class="hex-grid" id="hexGrid"></div>
  <div class="clear-row">
    <span class="hint" id="selHint">Select a type</span>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Attacking</p>
  <div class="results" id="atkResults"></div>
</div>

<div class="panel">
  <p class="panel-title">Defending</p>
  <div class="results" id="defResults"></div>
</div>

<div class="panel">
  <label class="matrix-toggle">
    <input type="checkbox" id="matrixToggle">
    Show full 18 &times; 18 attack matrix
  </label>
  <div class="matrix-wrap" id="matrixWrap" style="display:none;"></div>
</div>

<footer>Rows attack, columns defend. Multipliers reflect the standard modern type chart.</footer>

</div>

<script>
const TYPES = ["Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"];

const COLORS = {
  Normal:"#A8A878", Fire:"#F08030", Water:"#6890F0", Electric:"#F8D030",
  Grass:"#78C850", Ice:"#98D8D8", Fighting:"#C03028", Poison:"#A040A0",
  Ground:"#E0C068", Flying:"#A890F0", Psychic:"#F85888", Bug:"#A8B820",
  Rock:"#B8A038", Ghost:"#705898", Dragon:"#7038F8", Dark:"#705848",
  Steel:"#B8B8D0", Fairy:"#EE99AC"
};

const CHART = {
  Normal:{Rock:0.5, Ghost:0, Steel:0.5},
  Fire:{Fire:0.5, Water:0.5, Grass:2, Ice:2, Bug:2, Rock:0.5, Dragon:0.5, Steel:2},
  Water:{Fire:2, Water:0.5, Grass:0.5, Ground:2, Rock:2, Dragon:0.5},
  Electric:{Water:2, Electric:0.5, Grass:0.5, Ground:0, Flying:2, Dragon:0.5},
  Grass:{Fire:0.5, Water:2, Grass:0.5, Poison:0.5, Ground:2, Flying:0.5, Bug:0.5, Rock:2, Dragon:0.5, Steel:0.5},
  Ice:{Fire:0.5, Water:0.5, Grass:2, Ice:0.5, Ground:2, Flying:2, Dragon:2, Steel:0.5},
  Fighting:{Normal:2, Ice:2, Poison:0.5, Flying:0.5, Psychic:0.5, Bug:0.5, Rock:2, Ghost:0, Dark:2, Steel:2, Fairy:0.5},
  Poison:{Grass:2, Poison:0.5, Ground:0.5, Rock:0.5, Ghost:0.5, Steel:0, Fairy:2},
  Ground:{Fire:2, Electric:2, Grass:0.5, Poison:2, Flying:0, Bug:0.5, Rock:2, Steel:2},
  Flying:{Electric:0.5, Grass:2, Fighting:2, Bug:2, Rock:0.5, Steel:0.5},
  Psychic:{Fighting:2, Poison:2, Psychic:0.5, Dark:0, Steel:0.5},
  Bug:{Fire:0.5, Grass:2, Fighting:0.5, Poison:0.5, Flying:0.5, Psychic:2, Ghost:0.5, Dark:2, Steel:0.5, Fairy:0.5},
  Rock:{Fire:2, Ice:2, Fighting:0.5, Ground:0.5, Flying:2, Bug:2, Steel:0.5},
  Ghost:{Normal:0, Psychic:2, Ghost:2, Dark:0.5},
  Dragon:{Dragon:2, Steel:0.5, Fairy:0},
  Dark:{Fighting:0.5, Psychic:2, Ghost:2, Dark:0.5, Fairy:0.5},
  Steel:{Fire:0.5, Water:0.5, Electric:0.5, Ice:2, Rock:2, Steel:0.5, Fairy:2},
  Fairy:{Fire:0.5, Fighting:2, Poison:0.5, Dragon:2, Dark:2, Steel:0.5}
};

function getMult(atk, def){
  const row = CHART[atk];
  if(row && Object.prototype.hasOwnProperty.call(row, def)) return row[def];
  return 1;
}

let selected = null;

function renderHexGrid(){
  const grid = document.getElementById('hexGrid');
  grid.innerHTML = '';
  TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'hex-btn' + (selected === t ? ' active' : '');
    btn.style.background = COLORS[t];
    btn.style.color = '#12141f';
    if(selected === t){
      btn.style.boxShadow = `0 0 0 3px var(--bg), 0 0 0 5px ${COLORS[t]}, 0 6px 18px -4px rgba(0,0,0,.5)`;
    }
    btn.textContent = t;
    btn.setAttribute('aria-pressed', selected === t);
    btn.onclick = () => toggleType(t);
    grid.appendChild(btn);
  });
}

function toggleType(t){
  selected = (selected === t) ? null : t;
  renderAll();
}

function renderHint(){
  const hint = document.getElementById('selHint');
  hint.textContent = selected ? selected : 'Select a type';
}

function bucketColor(label){
  if(label.includes('4x') || label.includes('2x')) return '#f0997b';
  if(label.includes('No effect')) return '#9198b8';
  if(label.includes('0.25') || label.includes('0.5')) return '#9fe1cb';
  return 'var(--text-dim)';
}

function buildBuckets(mults){
  const buckets = {
    '4x': [], '2x': [], '1x': [],
    '0.5x': [], '0.25x': [], 'No effect': []
  };
  Object.entries(mults).forEach(([t, mult]) => {
    mult = Math.round(mult * 100) / 100;
    if(mult === 4) buckets['4x'].push(t);
    else if(mult === 2) buckets['2x'].push(t);
    else if(mult === 1) buckets['1x'].push(t);
    else if(mult === 0.5) buckets['0.5x'].push(t);
    else if(mult === 0.25) buckets['0.25x'].push(t);
    else if(mult === 0) buckets['No effect'].push(t);
  });
  return buckets;
}

function renderBucketCards(container, buckets, suffix){
  container.innerHTML = '';
  Object.entries(buckets).forEach(([label, list]) => {
    if(list.length === 0) return;
    const fullLabel = label + ' ' + suffix;
    const card = document.createElement('div');
    card.className = 'result-card';
    const title = document.createElement('p');
    title.className = 'rc-title';
    title.style.color = bucketColor(label);
    title.textContent = fullLabel;
    const chips = document.createElement('div');
    chips.className = 'chip-row';
    list.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.background = COLORS[t];
      chip.textContent = t;
      chips.appendChild(chip);
    });
    card.appendChild(title);
    card.appendChild(chips);
    container.appendChild(card);
  });
}

function renderResults(){
  const atkContainer = document.getElementById('atkResults');
  const defContainer = document.getElementById('defResults');
  if(!selected){
    atkContainer.innerHTML = '<div class="empty-note">Pick a type above to see its offensive matchups.</div>';
    defContainer.innerHTML = '<div class="empty-note">Pick a type above to see its defensive matchups.</div>';
    return;
  }

  const atkMults = {};
  TYPES.forEach(def => { atkMults[def] = getMult(selected, def); });
  renderBucketCards(atkContainer, buildBuckets(atkMults), 'dealt');

  const defMults = {};
  TYPES.forEach(atk => { defMults[atk] = getMult(atk, selected); });
  renderBucketCards(defContainer, buildBuckets(defMults), 'taken');
}

function cellClass(m){
  if(m === 0) return 'm0';
  if(m === 0.25) return 'mquarter';
  if(m === 0.5) return 'mhalf';
  if(m === 1) return 'm1';
  if(m === 2) return 'm2';
  if(m === 4) return 'm4';
  return 'm1';
}

function renderMatrix(){
  const wrap = document.getElementById('matrixWrap');
  if(document.getElementById('matrixToggle').checked === false){
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  if(wrap.dataset.built === '1') return;
  let html = '<table class="matrix"><thead><tr><th class="row-head"></th>';
  TYPES.forEach(def => {
    html += `<th style="background:${COLORS[def]}">${def}</th>`;
  });
  html += '</tr></thead><tbody>';
  TYPES.forEach(atk => {
    html += `<tr><th class="row-head" style="color:${COLORS[atk]}">${atk}</th>`;
    TYPES.forEach(def => {
      const m = getMult(atk, def);
      const label = m === 1 ? '' : (m === 0.25 ? '&frac14;' : (m === 0.5 ? '&frac12;' : m));
      html += `<td class="${cellClass(m)}">${label}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
  wrap.dataset.built = '1';
}

document.getElementById('clearBtn').onclick = () => { selected = null; renderAll(); };
document.getElementById('matrixToggle').onchange = renderMatrix;

function renderAll(){
  renderHexGrid();
  renderHint();
  renderResults();
}

renderAll();
</script>
</body>
</html>
