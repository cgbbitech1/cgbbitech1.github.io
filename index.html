<style>
  .pd-wrap{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#2a2a28;max-width:1100px;margin:0 auto;padding:4px 0 32px}
  .pd-wrap *{box-sizing:border-box}
  .pd-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:14px}
  .pd-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0}
  .pd-sub{font-size:13px;color:#6b6b66;margin:4px 0 0}
  .pd-progress{min-width:220px;flex:1}
  .pd-rail{height:8px;border-radius:4px;background:#e4e2da;overflow:hidden;display:flex}
  .pd-rail span{height:100%;transition:width .35s ease}
  .pd-count{font-size:12px;color:#6b6b66;margin-top:6px;display:flex;justify-content:space-between}
  .pd-map{position:relative;border-radius:14px;overflow:hidden;border:1px solid #d8d6ce;line-height:0;background:#4a8fa3}
  .pd-map img{width:100%;height:auto;display:block}
  .pd-pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;cursor:pointer;line-height:1;transition:transform .15s ease,opacity .15s ease;box-shadow:0 1px 4px rgba(0,0,0,.35);padding:0}
  .pd-pin:hover,.pd-pin:focus-visible{transform:scale(1.28);z-index:6;outline:none}
  .pd-pin:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px #2a2a28}
  .pd-pin.done{opacity:.5;filter:grayscale(.7)}
  .pd-pin.next{box-shadow:0 0 0 4px rgba(226,182,76,1),0 0 16px 3px rgba(226,182,76,.75),0 1px 4px rgba(0,0,0,.35);z-index:5}
  .pd-pin.sel{transform:scale(1.28);z-index:7;box-shadow:0 0 0 3px #fff,0 0 0 5px #2a2a28}
  .pd-row.next{box-shadow:inset 4px 0 0 #dfae44}
  .pd-row.next .pd-num{box-shadow:0 0 0 3px rgba(226,182,76,1),0 0 8px rgba(226,182,76,.6)}
  @media (prefers-reduced-motion:no-preference){
    @keyframes pdnext{0%,100%{box-shadow:0 0 0 4px rgba(226,182,76,1),0 0 12px 2px rgba(226,182,76,.55),0 1px 4px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 4px rgba(226,182,76,1),0 0 22px 5px rgba(226,182,76,.95),0 1px 4px rgba(0,0,0,.35)}}
    .pd-pin.next:not(.sel){animation:pdnext 2.2s ease-in-out infinite}
  }
  .pd-tip{position:absolute;z-index:20;background:#232321;color:#f5f3ec;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .12s;max-width:230px;transform:translate(-50%,-100%);white-space:normal}
  .pd-tip b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
  .pd-tip.on{opacity:1}
  .pd-detail{margin-top:16px;border:1px solid #d8d6ce;border-radius:14px;background:#faf9f5;padding:18px 20px;min-height:96px}
  .pd-detail.empty{color:#8a8a83;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center}
  .pd-dtop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .pd-eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
  .pd-dname{font-size:19px;font-weight:600;margin:2px 0 0}
  .pd-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .pd-chip{font-size:12px;border:1px solid #ddd9cd;background:#fff;border-radius:999px;padding:4px 11px}
  .pd-chip b{font-weight:600}
  .pd-tip-text{font-size:14px;line-height:1.6;margin:6px 0 0;color:#43433f}
  .pd-btn{border:1px solid #2a2a28;background:#2a2a28;color:#fff;font:inherit;font-size:13px;font-weight:500;border-radius:8px;padding:8px 15px;cursor:pointer}
  .pd-btn.off{background:#fff;color:#2a2a28}
  .pd-btn:focus-visible{outline:2px solid #2a2a28;outline-offset:2px}
  .pd-secthead{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px}
  .pd-secthead h3{font-size:14px;font-weight:600;margin:0;letter-spacing:.02em}
  .pd-secthead span{font-size:12px;color:#8a8a83}
  .pd-list{border:1px solid #d8d6ce;border-radius:12px;overflow:hidden}
  .pd-row{display:flex;align-items:center;gap:12px;padding:9px 13px;border-top:1px solid #eae7dd;background:#fff;cursor:pointer;font-size:14px}
  .pd-row:first-child{border-top:none}
  .pd-row:hover{background:#f6f4ed}
  .pd-row.sel{background:#f0eee5}
  .pd-row.done .pd-rname{text-decoration:line-through;color:#9a9a93}
  .pd-num{width:26px;height:26px;flex:none;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .pd-row.done .pd-num{opacity:.45;filter:grayscale(.7)}
  .pd-rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pd-rtype{font-size:12px;color:#77776f;flex:none}
  .pd-rlvl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#77776f;width:52px;text-align:right;flex:none}
  .pd-check{width:20px;height:20px;flex:none;border:1.5px solid #c6c3b8;border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .pd-check[aria-pressed="true"]{background:#2a2a28;border-color:#2a2a28;color:#fff}
  .pd-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:12px;color:#8a8a83;flex-wrap:wrap}
  .pd-link{background:none;border:none;font:inherit;color:#8a8a83;text-decoration:underline;cursor:pointer;padding:0}
  @media (max-width:620px){.pd-pin{width:26px;height:26px;margin:-13px 0 0 -13px;font-size:11px;border-width:2px}.pd-rtype{display:none}}
  @media (prefers-color-scheme:dark){
    .pd-wrap{color:#e8e6de}.pd-sub,.pd-count,.pd-secthead span,.pd-foot,.pd-link{color:#a3a19a}
    .pd-rail{background:#3a3a36}.pd-map,.pd-detail,.pd-list{border-color:#45443f}
    .pd-detail{background:#262623}.pd-tip-text{color:#cfcdc5}
    .pd-chip{background:#1e1e1c;border-color:#45443f;color:#e8e6de}
    .pd-row{background:#1e1e1c;border-top-color:#33322e}.pd-row:hover{background:#262623}.pd-row.sel{background:#2c2c28}
    .pd-rtype,.pd-rlvl{color:#a3a19a}.pd-row.done .pd-rname{color:#78766f}
    .pd-btn{background:#e8e6de;color:#1e1e1c;border-color:#e8e6de}.pd-btn.off{background:#1e1e1c;color:#e8e6de;border-color:#5a584f}
    .pd-check{background:#1e1e1c;border-color:#5a584f}.pd-check[aria-pressed="true"]{background:#e8e6de;border-color:#e8e6de;color:#1e1e1c}
    .pd-detail.empty{color:#87857e}
  }
</style>

}

      '<button class="pd-check" type="button" aria-pressed="false" aria-label="Mark '+d.name+' cleared"></button>';
    r.addEventListener('click',e=>{
      if(e.target.classList.contains('pd-check')){toggle(d.n);} else {select(d.n);}
    });
    r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d.n);}});
    l.appendChild(r);
  });
  sections.appendChild(h); sections.appendChild(l);
});

function select(n){sel=n;render();}
function toggle(n){done.has(n)?done.delete(n):done.add(n);render();save();}

function nextUp(){const d=D.find(x=>!done.has(x.n));return d?d.n:null;}
function render(){
  const nx=nextUp();
  document.querySelectorAll('.pd-pin').forEach(b=>{
    const n=+b.dataset.n; b.classList.toggle('done',done.has(n)); b.classList.toggle('sel',sel===n);
    b.classList.toggle('next',nx===n);
    b.innerHTML=done.has(n)?'&#10003;':n;
  });
  document.querySelectorAll('.pd-row').forEach(r=>{
    const n=+r.dataset.n; r.classList.toggle('done',done.has(n)); r.classList.toggle('sel',sel===n);
    r.classList.toggle('next',nx===n);
    r.querySelector('.pd-check').setAttribute('aria-pressed',done.has(n));
    r.querySelector('.pd-check').innerHTML=done.has(n)?'&#10003;':'';
  });
  const rail=document.getElementById('rail').children;
  ['vr','pl','ss'].forEach((g,i)=>{
    const tot=D.length, c=D.filter(d=>d.g===g&&done.has(d.n)).length;
    rail[i].style.width=(c/tot*100)+'%';
  });
  const others=D.filter(d=>d.g==='fin'&&done.has(d.n)).length;
  rail[2].style.width=((D.filter(d=>d.g==='ss'&&done.has(d.n)).length+others)/D.length*100)+'%';
  document.getElementById('cnt').textContent=done.size+' of '+D.length+' cleared';
  document.getElementById('pct').textContent=Math.round(done.size/D.length*100)+'%';
  if(sel==null){detail.className='pd-detail empty';detail.textContent='Hover a marker for a quick look. Select one for the full entry.';return;}
  const d=D.find(x=>x.n===sel), is=done.has(d.n);
  detail.className='pd-detail';
  detail.innerHTML='<div class="pd-dtop"><div><div class="pd-eyebrow" style="color:'+C[d.g]+'">'+d.n+' &middot; '+PATHS[d.g]+(nx===d.n?' <span style="color:#a8853a">&middot; next up</span>':'')+'</div>'+
    '<p class="pd-dname">'+d.name+'</p></div>'+
    '<button class="pd-btn'+(is?' off':'')+'" id="mark">'+(is?'Mark not cleared':'Mark cleared')+'</button></div>'+
    '<div class="pd-meta"><span class="pd-chip"><b>Opponent</b> '+d.foe+'</span>'+
    '<span class="pd-chip"><b>Team type</b> '+d.type+'</span>'+
    '<span class="pd-chip"><b>Level</b> '+d.lvl+'</span>'+
    (d.loc?'<span class="pd-chip"><b>Where</b> '+d.loc+'</span>':'')+'</div>'+
    '<p class="pd-tip-text">'+d.tip+'</p>';
  document.getElementById('mark').addEventListener('click',()=>toggle(d.n));
}

const HAS_STORE = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
async function save(){
  if(!ready)return;
  const s=document.getElementById('saved');
  if(!HAS_STORE){s.textContent='Not saving here - progress lasts until you close this view';return;}
  s.textContent='Saving...';
  try{await window.storage.set(KEY,JSON.stringify([...done]));s.textContent='Progress saved';}
  catch(e){s.textContent='Save failed - progress lasts until you close this view';}
}
async function load(){
  const s=document.getElementById('saved');
  if(!HAS_STORE){s.textContent='Not saving here - progress lasts until you close this view';ready=true;render();return;}
  try{const r=await window.storage.get(KEY); if(r&&r.value)done=new Set(JSON.parse(r.value)); s.textContent=done.size?'Progress restored ('+done.size+' cleared)':'Progress saves automatically';}
  catch(e){s.textContent='Progress saves automatically';}
  ready=true;render();
}
document.getElementById('reset').addEventListener('click',()=>{done=new Set();sel=null;render();save();});
render();load();
</script>
